[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organize-core"
version = "0.1.0"
description = "Core engine for the KMS organize stage: vault index, suggestions, safe file ops, automation consumers (spec/10-architecture-core-and-clients.md)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
organize = "organize_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines in docstrings quoting the spec are acceptable
ignore = ["E501"]
